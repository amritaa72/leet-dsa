name: Sync Leetcode
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # Runs every morning at 8:00 AM IST
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: leetcode-solutions
          
      # Forces GitHub to attribute the contributions directly to your profile
      - name: Configure Git Author
        run: |
          git config --global user.email "amritaavarshini777@gmail.com"
